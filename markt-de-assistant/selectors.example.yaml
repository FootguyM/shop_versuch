# ===========================================================================
#  Selektor-Overrides
#
#  Kopieren nach "selectors.yaml", sobald der Bot ein Element nicht mehr
#  findet. Was hier steht, wird VOR den eingebauten Kandidaten probiert; die
#  Defaults bleiben als Auffangnetz bestehen.
#
#  Den passenden Selektor findest du so:
#    1. Seite in Chrome oeffnen, Rechtsklick auf das Element -> Untersuchen
#    2. Im DevTools-Baum Rechtsklick -> Copy -> Copy selector
#    3. Hier mit dem Praefix "css=" eintragen
#
#  Praefixe:
#    css=...   CSS-Selektor
#    text=...  Textinhalt, /.../i fuer Regex ohne Gross-Kleinschreibung
#    role=...  ARIA-Rolle, z. B. role=button[name=/senden/i]
#
#  Pruefen mit:  python run.py doctor https://www.markt.de/postfach/
# ===========================================================================

