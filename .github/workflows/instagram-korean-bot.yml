# Telegram-Bot, der die Followerliste eines Instagram-Accounts etappenweise
# nach koreanischen Zeichen im Profilnamen durchsucht.
#
# Laeuft komplett bei GitHub -- unabhaengig vom Shop, ohne eigenen Rechner.
# Jeder Durchlauf holt die Telegram-Befehle ab, arbeitet ein Stueck der Liste
# ab, schickt die neuen Treffer und legt den Zwischenstand im Zweig
# "bot-state" ab. Der naechste Durchlauf macht genau dort weiter.
#
# Einrichtung: siehe tools/instagram-korean-filter/BOT.md

name: Instagram-Korea-Bot

on:
  schedule:
    # Einmal pro Stunde. Bei einem privaten Repository zaehlt GitHub jeden
    # angefangenen Lauf als volle Minute -- haeufiger gestartet waeren die
    # 2000 Freiminuten im Monat allein durchs Nachschauen aufgebraucht.
    # Dafuer arbeitet ein Lauf dann 45 Minuten am Stueck (siehe unten).
    # Bei einem oeffentlichen Repository sind die Minuten unbegrenzt, dort
    # darf hier gern '*/15 * * * *' stehen.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      account:
        description: 'Instagram-Account, dessen Follower geprueft werden sollen (leer = nur weiterarbeiten)'
        required: false
        default: ''

# Nie zwei Etappen gleichzeitig -- sonst ueberschreiben sie sich den Zwischenstand.
concurrency:
  group: instagram-korean-bot
  cancel-in-progress: false

jobs:
  etappe:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write # nur, um den Zwischenstand im Zweig bot-state zu speichern

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Zwischenstand laden
        run: |
          mkdir -p .botstate
          if git fetch --depth=1 origin bot-state 2>/dev/null \
             && git show FETCH_HEAD:state.json > .botstate/state.json 2>/dev/null; then
            echo "Zwischenstand aus dem Zweig bot-state geladen."
          else
            echo '{}' > .botstate/state.json
            echo "Kein Zwischenstand gefunden -- fange bei null an."
          fi

      - name: Etappe abarbeiten
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOWED_USERNAME: ${{ vars.TELEGRAM_ALLOWED_USERNAME || 'vvalora' }}
          # Quelle der Followerliste: 'apify' (fertiger Scraper, kein eigener
          # Instagram-Login) oder 'instagram' (eigenes Session-Cookie).
          BOT_SOURCE: ${{ vars.BOT_SOURCE || 'apify' }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: ${{ vars.APIFY_ACTOR || 'scraping_solutions/instagram-scraper-followers-following-no-cookies' }}
          # Eingabe fuer den Actor; leer lassen heisst: Vorgabe aus bot.mjs.
          # Platzhalter {{username}} und {{limit}} werden eingesetzt.
          APIFY_INPUT: ${{ vars.APIFY_INPUT }}
          # Obergrenze je Scan, wenn im Befehl keine Zahl steht -- schuetzt
          # davor, versehentlich viel Apify-Guthaben auszugeben.
          APIFY_DEFAULT_LIMIT: ${{ vars.APIFY_DEFAULT_LIMIT || '1000' }}
          # Nur fuer die Kostenschaetzung in der Startmeldung (US-Dollar/1000).
          APIFY_PRICE_PER_1000: ${{ vars.APIFY_PRICE_PER_1000 || '2.5' }}
          # Nur fuer die Quelle 'instagram':
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          BOT_STATE_FILE: .botstate/state.json
          # Wie lange eine Etappe hoechstens arbeitet (der Lauf darf 55 Min).
          BOT_RUN_BUDGET_SECONDS: '2700'
          # Bewusst gemuetlich: gut 12 Sekunden Pause zwischen den Abrufen
          # (leicht gestreut). Ergibt rund 11.000 gepruefte Profile pro Etappe.
          BOT_DELAY_MS: '12000'
          BOT_PAGE_SIZE: '50'
          # Nach so vielen geprueften Profilen kommen die neuen Treffer.
          BOT_STAGE_SIZE: '1000'
          BOT_START_SCAN: ${{ github.event.inputs.account }}
        run: node tools/instagram-korean-filter/bot.mjs

      - name: Zwischenstand sichern
        if: always()
        run: |
          git config user.name 'instagram-korean-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Der Zweig bot-state traegt nur diese eine Datei und keine Historie.
          BLOB=$(git hash-object -w .botstate/state.json)
          TREE=$(printf '100644 blob %s\tstate.json\n' "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -m "Bot-Zwischenstand $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          git push --force origin "$COMMIT:refs/heads/bot-state"
          echo "Zwischenstand gespeichert."
